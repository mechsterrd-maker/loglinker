name: Build Loglinkr HR APK

# Manual "Run workflow" button, a tag like hr-v1.0, OR any change to the Android
# project / this workflow on main. Produces a signed, sideloadable .apk and
# publishes it to the hr-latest release the website's Download button points to.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-hr-apk.yml'
    tags: [ 'hr-v*' ]

permissions:
  contents: write   # needed to publish the APK as a Release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Build signed release APK
        working-directory: android
        # Optional: set repo secrets LLK_KEYSTORE_B64 / LLK_STORE_PASS / LLK_KEY_ALIAS /
        # LLK_KEY_PASS to sign with your own key. Without them it uses the committed
        # internal keystore (fine for sideloading; rotate before any Play release).
        env:
          LLK_STORE_PASS: ${{ secrets.LLK_STORE_PASS }}
          LLK_KEY_ALIAS: ${{ secrets.LLK_KEY_ALIAS }}
          LLK_KEY_PASS: ${{ secrets.LLK_KEY_PASS }}
        run: |
          if [ -n "${{ secrets.LLK_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.LLK_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/llk.keystore"
            export LLK_KEYSTORE="$RUNNER_TEMP/llk.keystore"
          fi
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk loglinkr-hr.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loglinkr-hr-apk
          path: loglinkr-hr.apk
          if-no-files-found: error

      # Publish to a stable release so the website's "Download APK" button works:
      # https://github.com/mechsterrd-maker/loglinker/releases/download/hr-latest/loglinkr-hr.apk
      - name: Publish to hr-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hr-latest
          name: LogLinkr HR (latest)
          body: Latest LogLinkr HR Android build. Download loglinkr-hr.apk below.
          files: loglinkr-hr.apk
          make_latest: true
