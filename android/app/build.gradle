apply plugin: 'com.android.application'

android {
    namespace 'com.loglinkr.hr'
    compileSdk 34

    defaultConfig {
        applicationId 'com.loglinkr.hr'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Release signing. CI overrides these via env vars (from GitHub Secrets) when
    // present; otherwise it falls back to the committed internal keystore so a
    // build "just works" for sideloading. Rotate to a secret-based key before any
    // Play Store release.
    signingConfigs {
        release {
            storeFile file(System.getenv('LLK_KEYSTORE') ?: '../keystore/loglinkr-hr.keystore')
            storePassword System.getenv('LLK_STORE_PASS') ?: 'loglinkr-hr'
            keyAlias System.getenv('LLK_KEY_ALIAS') ?: 'loglinkrhr'
            keyPassword System.getenv('LLK_KEY_PASS') ?: 'loglinkr-hr'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Trusted Web Activity launcher — opens the PWA full-screen in the device's
    // Chrome engine (so camera / WebGL / face-api all work exactly as in-browser).
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
